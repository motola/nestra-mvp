name: Deploy — Dev Frontend

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/deploy-dev-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io (Dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: frontend
        run: flyctl deploy --remote-only --app nestra-frontend-dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
