name: Deploy — Dev Frontend

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/deploy-dev-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io (Dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: frontend
        run: flyctl deploy --remote-only --app nestra-mvp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_FRONTEND }}
          NEXT_PUBLIC_API_URL: https://nestra-mvp-api.fly.dev

      - name: Output deployment URL
        run: |
          echo "Frontend deployed successfully!"
          echo ""
          echo "Deployment URL: https://nestra-mvp.fly.dev"
          echo ""
          echo "API URL: https://nestra-mvp-api.fly.dev"

      - name: Post deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** [https://nestra-mvp.fly.dev](https://nestra-mvp.fly.dev)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API:** https://nestra-mvp-api.fly.dev" >> $GITHUB_STEP_SUMMARY
